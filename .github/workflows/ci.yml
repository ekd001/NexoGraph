name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Syntax check all JS files
        run: |
          node -e "
          const fs = require('fs');
          const glob = require('glob');
          const files = glob.globSync('{viewer,scanner}/**/*.js');
          let errors = 0;
          for (const f of files) {
            try { new Function(fs.readFileSync(f, 'utf-8')); }
            catch (e) { console.error('SYNTAX ERROR:', f, e.message); errors++; }
          }
          if (errors) process.exit(1);
          console.log(files.length + ' files checked — all OK');
          "

      - name: Check CSS variables coverage
        run: |
          node -e "
          const fs = require('fs');
          const style = fs.readFileSync('viewer/style.css','utf-8');
          const dark = fs.readFileSync('viewer/themes/dark.css','utf-8');
          const light = fs.readFileSync('viewer/themes/light.css','utf-8');
          const used = [...new Set([...style.matchAll(/var\(--([a-z][a-z-]*)\)/g)].map(m=>m[1]))];
          const definedDark = [...dark.matchAll(/--([a-z][a-z-]*)\s*:/g)].map(m=>m[1]);
          const definedLight = [...light.matchAll(/--([a-z][a-z-]*)\s*:/g)].map(m=>m[1]);
          const skip = ['sp-','radius-','font-','z-','transition'];
          const missDark = used.filter(v => !definedDark.includes(v) && !skip.some(p=>v.startsWith(p)));
          const missLight = used.filter(v => !definedLight.includes(v) && !skip.some(p=>v.startsWith(p)));
          if (missDark.length) { console.error('Missing in dark.css:', missDark); process.exit(1); }
          if (missLight.length) { console.error('Missing in light.css:', missLight); process.exit(1); }
          console.log('CSS variables: all covered in both themes');
          "

      - name: Test scanner on sample
        run: |
          node -e "
          const { scan } = require('./scanner');
          // Smoke test: scanner loads without error
          console.log('Scanner module loaded OK');
          "

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify all HTML references exist
        run: |
          node -e "
          const fs = require('fs');
          const html = fs.readFileSync('viewer/index.html','utf-8');
          let ok = true;
          [...html.matchAll(/src=\"([^\"]+\.js)\"/g)].forEach(m => {
            if (m[1].startsWith('http')) return;
            if (!fs.existsSync('viewer/' + m[1])) { console.error('Missing:', m[1]); ok = false; }
          });
          [...html.matchAll(/href=\"([^\"]+\.(?:css|svg))\"/g)].forEach(m => {
            if (m[1].startsWith('http')) return;
            if (!fs.existsSync('viewer/' + m[1])) { console.error('Missing:', m[1]); ok = false; }
          });
          if (!ok) process.exit(1);
          console.log('All HTML references verified');
          "

      - name: Server starts without error
        run: |
          timeout 3 node -e "
          const express = require('express');
          const app = express();
          app.listen(0, () => { console.log('Server starts OK'); process.exit(0); });
          " || true
