name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run CI checks
        run: |
          node -e "
          const fs = require('fs');
          const glob = require('glob');
          const files = glob.globSync('{viewer,scanner}/**/*.js');
          for (const f of files) { new Function(fs.readFileSync(f, 'utf-8')); }
          console.log(files.length + ' files — syntax OK');
          "

      - name: Package release artifact
        run: |
          mkdir -p dist
          cp -r viewer scanner server.js package.json package-lock.json dist/
          cd dist && tar -czf ../nexograph-${{ github.ref_name }}.tar.gz .
          cd .. && zip -r nexograph-${{ github.ref_name }}.zip dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nexograph-${{ github.ref_name }}.tar.gz
            nexograph-${{ github.ref_name }}.zip
